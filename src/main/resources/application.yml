server:
  port: 8080

spring:
  application:
    name: ai-certification-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:certtracker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:stub-key}
    model: claude-3-7-sonnet-20250219

gemini:
  api:
    key: ${GEMINI_API_KEY:stub-key}
    model: gemini-1.5-pro
